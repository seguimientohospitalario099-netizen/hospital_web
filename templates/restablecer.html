<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Hospital San José de Chincha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .bg-image {
            position: fixed;
            inset: 0;
            background: url("{{ url_for('static', filename='images/Fondo.png') }}") center center / cover no-repeat;
            filter: blur(6px) brightness(0.55);
            transform: scale(1.08);
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 60, 0.45);
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 48px 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp .5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .logo-wrapper img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            padding: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 14px;
        }

        .logo-wrapper h1 {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .logo-wrapper p {
            color: rgba(255,255,255,0.75);
            font-size: 0.78rem;
            font-weight: 400;
            margin-top: 3px;
            text-align: center;
        }

        .flash-msg {
            width: 100%;
            background: rgba(229, 57, 53, 0.18);
            border: 1px solid rgba(229, 57, 53, 0.5);
            color: #ffcdd2;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }

        form { width: 100%; }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon-left {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
        }

        #password {
            padding-left: 48px;
            padding-right: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color .25s, background .25s;
        }

        .input-group input::placeholder { color: rgba(255,255,255,0.45); }

        .input-group input:focus {
            border-color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.18);
        }

        .btn-eye {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 4px 6px;
            cursor: pointer;
            color: rgba(255,255,255,0.55);
            font-size: 15px;
            line-height: 1;
            z-index: 3;
            transition: color .2s;
        }
        .btn-eye:hover { color: #ffffff; }
        .btn-eye:focus { outline: none; }

        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none !important;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #1a6e3c 0%, #28a745 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.45);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(40, 167, 69, 0.55);
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 11.5px;
        }
    </style>
</head>

<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="login-card">
        <div class="logo-wrapper">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Hospital San José">
            <h1>Nueva Contraseña</h1>
            <p>Ingresa tu nueva contraseña para actualizar tu cuenta</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="flash-msg"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/restablecer" method="POST">
            <!-- Campos ocultos para capturar el token y código -->
            <input type="hidden" id="code" name="code" value="{{ code or '' }}">
            <input type="hidden" id="access_token" name="access_token" value="">
            <input type="hidden" id="refresh_token" name="refresh_token" value="">

            <div class="input-group">
                <label for="password">Nueva Contraseña</label>
                <div class="input-wrapper">
                    <button type="button" class="btn-eye" id="togglePassword" tabindex="-1" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                    </button>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-key"></i> Actualizar Contraseña
            </button>
        </form>

        <div class="login-footer">
            © 2026 Hospital San José de Chincha
        </div>
    </div>

    <script>
        // Manejador del ojo para ver contraseña
        var toggleBtn = document.getElementById('togglePassword');
        var pwdInput  = document.getElementById('password');
        var eyeIcon   = toggleBtn.querySelector('i');

        toggleBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            var isHidden = pwdInput.getAttribute('type') === 'password';
            pwdInput.setAttribute('type', isHidden ? 'text' : 'password');
            eyeIcon.classList.toggle('fa-eye',      !isHidden);
            eyeIcon.classList.toggle('fa-eye-slash', isHidden);
        });

        // Extraer los parámetros de fragmento hash si es flujo Implícito
        document.addEventListener("DOMContentLoaded", function() {
            var hash = window.location.hash;
            if (hash) {
                // El hash viene como #access_token=...&refresh_token=...
                var params = new URLSearchParams(hash.substring(1));
                var accessToken = params.get("access_token");
                var refreshToken = params.get("refresh_token");
                
                if (accessToken) {
                    document.getElementById("access_token").value = accessToken;
                }
                if (refreshToken) {
                    document.getElementById("refresh_token").value = refreshToken;
                }
            }
        });
    </script>

</body>
</html>
